services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toolkit
      POSTGRES_PASSWORD: toolkit
      POSTGRES_DB: toolkit
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolkit"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://toolkit:toolkit@db:5432/toolkit
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
