# Base: Traefik, which k3s installs and runs by default as the cluster's ingress
# controller (ingressClassName traefik). Verified 2026-09-07. Nothing here is
# installed by hand: the whole file is the adoption of a base k3s already ships.
#
# Deliberately no `host:` rule. Two reasons, both practical:
#   1. It answers on whatever address reaches the node, so the same Ingress works
#      from the tailnet by MagicDNS name and by the private IP 172.31.41.235.
#   2. Tailscale Funnel proxies to localhost:80 while sending the public
#      <machine>.<tailnet>.ts.net Host header. A host rule would 404 that unless it
#      were kept in sync with the funnel name by hand.
#
# Traefik listens on the node's ports 80 and 443. Neither is open in the instance's
# security group, so the only ways in are the tailnet and Tailscale Funnel.
#
# Funnel IS pointed at this Ingress, but it publishes only /health: every other path
# gets Tailscale's own 404 without ever reaching the app. That narrowing is the only
# thing keeping /simulate/* off the internet, because there is no host or path rule
# below and no auth in app/main.py, so anything Funnel publishes is public. Widening
# it re-exposes POST /simulate/db-down, which can take the demo offline until someone
# with cluster access restarts the pod: readiness pulls the only replica out of the
# Service, and the request that would undo it can then no longer reach the app. See
# "Publishing the demo with Tailscale Funnel" in README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-debugging-toolkit
  namespace: toolkit
  labels:
    app: api-debugging-toolkit
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-debugging-toolkit
                port:
                  # Matches the Service port name in service.yaml, which in turn
                  # follows the container port. Port 5000 end to end.
                  name: http
