[pytest]
testpaths = tests

# Put the repo root on sys.path so `pytest` (the console script) finds the
# package the same way `python -m pytest` does. Without this, a fresh clone and
# CI both fail at conftest import with ModuleNotFoundError. apihealthchecker has
# carried this line since it was written; these repos never got it, which is why
# every Actions run here has failed since the repo was created.
pythonpath = .
